<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bono - Official Album Pre Register</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="landing-section">
        <div class="container">
            <div class="brand-header">
                <img src="logo.svg" alt="Bono" class="logo">
                <h1>ALBUM RELEASE</h1>
                <p class="subtitle">THE NEW ALBUM BY BONO</p>
            </div>
            <div class="form-container">
                <form action="#">
                    <div class="form-group">
                        <input type="text" id="name" placeholder="Name" required>
                    </div>
                    <div class="form-group">
                        <input type="email" id="email" placeholder="Email Address" required>
                    </div>
                    <button type="submit" class="register-btn">Pre Register</button>
                </form>
            </div>
        </div>
    </main>
</body>
</html>
